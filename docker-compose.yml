# HireFlow AI — local stack
#
#   docker compose up -d                      → infrastructure only (Postgres, Redis, S3, Mailpit)
#                                               for running api/web with `pnpm dev`
#   docker compose --profile app up -d --build → full stack incl. api, worker and web containers
#
name: hireflow

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hireflow
      POSTGRES_PASSWORD: hireflow
      POSTGRES_DB: hireflow
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hireflow -d hireflow']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for development (MinIO images are no longer published on
  # Docker Hub). No identities are configured, so any access key is accepted locally.
  # The API creates the bucket on startup.
  s3:
    image: chrislusf/seaweedfs:latest
    command:
      [
        'server',
        '-dir=/data',
        '-s3',
        '-s3.port=9000',
        '-master.volumeSizeLimitMB=64',
        '-volume.max=100',
      ]
    ports:
      - '9000:9000'
    volumes:
      - s3-data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment: &app-env
      NODE_ENV: production
      # Local demo stack only: fixed secrets so `docker compose --profile app up` works out of the
      # box. Real deployments must inject their own secrets (see docs/DEPLOYMENT.md).
      JWT_SECRET: ${COMPOSE_JWT_SECRET:-local-compose-demo-access-secret-do-not-deploy}
      JWT_REFRESH_SECRET: ${COMPOSE_JWT_REFRESH_SECRET:-local-compose-demo-refresh-secret-do-not-deploy}
      WEB_URL: http://localhost:8080
      API_URL: http://localhost:8080
      TRUST_PROXY: 'true'
      DATABASE_URL: postgresql://hireflow:hireflow@postgres:5432/hireflow?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://s3:9000
      EMAIL_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      EMBEDDING_CACHE_DIR: /app/.cache/models
    command: ['sh', '-c', 'RUN_MIGRATIONS=true node dist/server.js']
    ports:
      - '4000:4000'
    volumes:
      - model-cache:/app/.cache/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    profiles: ['app']
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment: *app-env
    command: ['node', 'dist/worker.js']
    volumes:
      - model-cache:/app/.cache/models
    depends_on:
      api:
        condition: service_healthy

  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  s3-data:
  model-cache:
