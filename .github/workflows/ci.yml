name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Placeholders so config validation passes; tests never talk to real services with these.
  JWT_SECRET: ci-access-secret-0123456789-abcdefghijklmnop
  JWT_REFRESH_SECRET: ci-refresh-secret-0123456789-abcdefghijklmnop
  DATABASE_URL: postgresql://hireflow:hireflow@localhost:5432/hireflow?schema=public
  TEST_DATABASE_URL: postgresql://hireflow:hireflow@localhost:5432/hireflow_test?schema=public
  REDIS_URL: redis://localhost:6379

jobs:
  quality:
    name: Lint · Typecheck · Unit tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm db:generate
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  integration:
    name: API integration tests
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hireflow
          POSTGRES_PASSWORD: hireflow
          POSTGRES_DB: hireflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hireflow" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm db:generate
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: apps/api/.cache/models
          key: embedding-model-bge-small-en-v1.5
      - name: Integration tests (real Postgres + pgvector, inline queue, heuristic AI)
        working-directory: apps/api
        run: pnpm exec vitest run --project integration

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hireflow
          POSTGRES_PASSWORD: hireflow
          POSTGRES_DB: hireflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hireflow" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      NODE_ENV: development
      QUEUE_DRIVER: inline
      STORAGE_DRIVER: local
      EMAIL_PROVIDER: console
      AI_PROVIDER: heuristic
      WEB_URL: http://localhost:4173
      API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm db:generate && pnpm db:deploy
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: apps/api/.cache/models
          key: embedding-model-bge-small-en-v1.5
      - name: Seed demo data
        run: pnpm db:seed
      - name: Build
        run: pnpm --filter @hireflow/api build && pnpm --filter @hireflow/web exec vite build
      - name: Start API and web preview
        run: |
          (cd apps/api && node dist/server.js > ../../api.log 2>&1 &)
          (cd apps/web && pnpm exec vite preview --port 4173 > ../../web.log 2>&1 &)
          npx wait-on -t 120000 http://localhost:4000/api/health http://localhost:4173
      - run: pnpm --filter @hireflow/web exec playwright install --with-deps chromium
      - name: Playwright
        run: pnpm --filter @hireflow/web exec playwright test
        env:
          E2E_BASE_URL: http://localhost:4173
      - if: failure()
        run: tail -n 200 api.log web.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
